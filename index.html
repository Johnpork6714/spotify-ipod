<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPod Classic Retro UI</title>
<style>
:root { --ipod-bg: linear-gradient(145deg, #e6e6e6, #ffffff); --wheel-bg: #f2f2f2; --button-bg: linear-gradient(145deg, #ffffff, #e6e6e6); }
body { background-color: #2c3e50; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.ipod { background: var(--ipod-bg); width: 340px; height: 560px; border-radius: 30px; box-shadow: 20px 20px 60px #1a252f, -20px -20px 60px #3e5771; padding: 25px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; box-sizing: border-box; }
.screen { background-color: #fff; width: 100%; height: 200px; border: 4px solid #333; border-radius: 8px; box-sizing: border-box; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(to bottom, #eef2f3, #8e9eab); box-shadow: inset 0 0 10px rgba(0,0,0,0.2); overflow: hidden; }
.screen-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; color: #333; border-bottom: 1px solid #777; padding-bottom: 3px; }
.screen-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; margin: 10px 0; }
#track-title { font-size: 16px; font-weight: bold; color: #111; margin: 0 0 5px 0; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#track-artist { font-size: 13px; color: #444; margin: 0; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress-container { width: 100%; display: flex; flex-direction: column; align-items: center; }
.progress-bar-bg { width: 100%; height: 6px; background-color: #ddd; border-radius: 3px; overflow: hidden; margin-bottom: 5px; border: 1px solid #aaa; }
.progress-bar-fill { width: 0%; height: 100%; background-color: #333; transition: width 0.5s linear; }
.time-info { width: 100%; display: flex; justify-content: space-between; font-size: 11px; color: #333; font-family: monospace; }
.click-wheel { width: 240px; height: 240px; background-color: var(--wheel-bg); border-radius: 50%; position: relative; box-shadow: inset 0 0 15px rgba(0,0,0,0.1), 0 10px 20px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; user-select: none; }
.wheel-btn { position: absolute; font-weight: bold; color: #888; cursor: pointer; font-size: 14px; transition: color 0.2s; }
.wheel-btn:hover { color: #333; }
.menu-btn { top: 15px; }
.next-btn { right: 15px; }
.prev-btn { left: 15px; }
.play-pause-btn { bottom: 15px; }
.center-button { width: 80px; height: 80px; background: var(--button-bg); border-radius: 50%; border: 1px solid #ccc; box-shadow: 0 4px 8px rgba(0,0,0,0.1); cursor: pointer; z-index: 10; }
.center-button:active { background: #e6e6e6; }
.login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
.login-btn { background-color: #1DB954; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
.login-btn:hover { background-color: #1ed760; }
</style>
</head>
<body>
    <div class="ipod">
        <div class="screen" id="ipod-screen">
            <div class="screen-header"><span>iPod</span><span id="play-status">■</span></div>
            <div class="screen-content" id="screen-body">
                <div class="login-container"><p style="font-size:13px; color:#333; margin-bottom:12px;">Anslut till Spotify</p><button class="login-btn" onclick="loginToSpotify()">Logga in</button></div>
            </div>
            <div class="progress-container" id="progress-area" style="display: none;">
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
                <div class="time-info"><span id="time-current">0:00</span><span id="time-total">0:00</span></div>
            </div>
        </div>
        <div class="click-wheel">
            <div class="wheel-btn menu-btn">MENU</div>
            <div class="wheel-btn next-btn" id="btn-next">▶▶</div>
            <div class="wheel-btn prev-btn" id="btn-prev">◀◀</div>
            <div class="wheel-btn play-pause-btn" id="btn-play-pause">▶||</div>
            <div class="center-button" id="btn-center"></div>
        </div>
    </div>
<script>
const CLIENT_ID = 'bf46bb2ab87a4553bc85842dcc854571';
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES = ['user-modify-playback-state', 'user-read-playback-state'];
let accessToken = null; let pollTimer = null;

function loginToSpotify() {
    const authUrl = `https://spotify.com{f5466aa1b87a4553ae8304deef854571}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES.join(' '))}&response_type=token&show_dialog=true`;
    window.location.href = authUrl;
}

function checkAuth() {
    const hash = {};
    if (window.location.hash) { window.location.hash.substring(1).split('&').forEach(item => { const parts = item.split('='); if(parts && parts[0]) hash[parts[0]] = decodeURIComponent(parts[1] || ''); }); }
    if (hash.access_token) { accessToken = hash.access_token; localStorage.setItem('spotify_remote_token', accessToken); window.location.hash = ''; } else { accessToken = localStorage.getItem('spotify_remote_token'); }
    if (accessToken) { initRemoteControl(); }
}

function initRemoteControl() {
    document.getElementById('screen-body').innerHTML = `<p style="font-size:12px; color:#555; margin:0 0 5px 0;">Nu spelas</p><h3 id="track-title">Laddar...</h3><p id="track-artist"></p>`;
    document.getElementById('progress-area').style.display = 'flex';
    fetchCurrentPlayback(); pollTimer = setInterval(fetchCurrentPlayback, 2000); setupPhysicalButtons();
}

async function fetchCurrentPlayback() {
    if (!accessToken) return;
    try {
        const response = await fetch('https://spotify.com', { headers: { 'Authorization': `Bearer ${accessToken}` } });
        if (response.status === 401) { localStorage.removeItem('spotify_remote_token'); window.location.reload(); return; }
        if (response.status === 204 || response.status === 404) { updateIpodScreen("Ingen aktiv enhet", "Starta Spotify på din enhet", true, 0, 0); return; }
        const data = await response.json();
        if (data && data.item) { const trackName = data.item.name; const artistName = data.item.artists.map(a => a.name).join(', '); const isPaused = !data.is_playing; const currentPos = data.progress_ms; const duration = data.item.duration_ms; updateIpodScreen(trackName, artistName, isPaused, currentPos, duration); }
    } catch (error) { console.error(error); }
}

async function sendPlayerCommand(endpoint, method = 'PUT') {
    try { await fetch(`https://spotify.com/${endpoint}`, { method: method, headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' } }); setTimeout(fetchCurrentPlayback, 300); } catch (error) { console.error(error); }
}

function setupPhysicalButtons() {
    document.getElementById('btn-play-pause').onclick = async () => { const response = await fetch('https://spotify.com', { headers: { 'Authorization': `Bearer ${accessToken}` } }); if (response.status === 200) { const data = await response.json(); const endpoint = data.is_playing ? 'pause' : 'play'; sendPlayerCommand(endpoint, 'PUT'); } };
    document.getElementById('btn-next').onclick = () => sendPlayerCommand('next', 'POST');
    document.getElementById('btn-prev').onclick = () => sendPlayerCommand('previous', 'POST');
}

function updateIpodScreen(track, artist, isPaused, currentPos, duration) {
    document.getElementById('track-title').textContent = track; document.getElementById('track-artist').textContent = artist; document.getElementById('play-status').textContent = isPaused ? '‖' : '▶';
    const formatTime = (ms) => { if (!ms) return "0:00"; const s = Math.floor((ms / 1000) % 60); const m = Math.floor((ms / (1000 * 60)) % 60); return `${m}:${s < 10 ? '0' : ''}${s}`; };
    document.getElementById('time-current').textContent = formatTime(currentPos); document.getElementById('time-total').textContent = formatTime(duration);
    if (duration > 0) { const percentage = (currentPos / duration) * 100; document.getElementById('progress-fill').style.width = `${percentage}%`; } else { document.getElementById('progress-fill').style.width = '0%'; }
}

checkAuth();
</script>
</body>
</html>
